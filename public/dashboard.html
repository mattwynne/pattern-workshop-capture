<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f3b544">
  <title>Workshop patterns — live</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <header class="topbar"><a class="brand" href="/">Pattern Workshop</a><a href="/">Capture a pattern →</a></header>
  <main class="shell dashboard-shell">
    <div class="dashboard-header">
      <div><p class="eyebrow">Explore DDD 2026</p><h1>Our patterns</h1></div>
      <p class="live-badge" role="status"><span class="live-dot"></span> Live from the room</p>
    </div>
    <div id="board" class="pattern-board"><p class="empty">Waiting for the first pattern…</p></div>
  </main>
  <script type="module">
    const board = document.querySelector('#board');
    const labels = { drafting: 'Being written', publishing: 'Publishing', published: 'Published', failed: 'Needs another try' };
    const events = new EventSource('/api/dashboard/events');
    const badge = document.querySelector('.live-badge');
    events.onopen = () => { badge.textContent = 'Live from the room'; };
    events.onerror = () => { badge.textContent = 'Reconnecting… showing last update'; };
    events.onmessage = ({ data }) => {
      const drafts = JSON.parse(data);
      if (!drafts.length) { board.innerHTML = '<p class="empty">Waiting for the first pattern…</p>'; return; }
      board.replaceChildren(...drafts.map(draft => {
        const card = document.createElement(draft.publicUrl ? 'a' : 'article');
        card.className = 'status-card';
        if (draft.publicUrl) { card.href = draft.publicUrl; card.target = '_blank'; card.rel = 'noreferrer'; card.style.color = 'inherit'; card.style.textDecoration = 'none'; }
        const title = document.createElement('h2'); title.textContent = draft.name;
        const status = document.createElement('span'); status.className = `status ${draft.stage}`; status.textContent = labels[draft.stage] ?? draft.stage;
        card.append(title, status); return card;
      }));
    };
  </script>
</body>
</html>
